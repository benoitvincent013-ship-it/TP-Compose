# TP COMPOSE — configuration de Nginx (le front)
server {
    listen 80;

    # Le dossier qui contient la page HTML.
    root /usr/share/nginx/html;
    index index.html;

    # Tout ce qui commence par /api/ est transmis au service "api".
    # "api" est le nom du service dans docker-compose.yml : Docker le traduit
    # automatiquement en adresse IP.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
    }

    # Tout le reste : la page HTML.
    location / {
        try_files $uri /index.html;
    }
}
